<!DOCTYPE html>
<head>

    <title>POTKIEES LOGIN</title>

		<!-- Set the website favicon to a cookie image -->
		<link rel="icon" href="image/cookie.png">

		<!-- Font Awesome icons stylesheet for additional graphical elements -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />

		<!-- jQuery library for JavaScript functionality -->
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

		<!-- jQuery UI library for additional UI features -->
		<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>


	<!-- Cascading Style Sheet -->	
	<style>
		@import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');

		* {
			box-sizing: border-box;
		}

		body {
			background-image:url('bgg.png');
			background-color: #EDE0D4;	
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			font-family: 'Montserrat', sans-serif;
			height: 100vh;
			margin: -20px 0 50px;
		}

		h1 {
			font-weight: bold;
			margin: 0;
			margin-bottom: 15px;
			margin-top: -15px;
			color: #7F5539;
		}

		h2 {
			text-align: center;
		}

		p {
			font-size: 14px;
			font-weight: 100;
			line-height: 20px;
			letter-spacing: 0.5px;
			margin: 20px 0 30px;
		}

		span {
			font-size: 12px;
		}

		a {
			color: #333;
			font-size: 14px;
			text-decoration: none;
			margin: 15px 0;
		}

		button {
			border-radius: 20px;
			border: 1px solid ;
			background-color: transparent;
			color: black;
			font-size: 12px;
			font-weight: bold;
			padding: 12px 45px;
			letter-spacing: 1px;
			text-transform: uppercase;
			transition: transform 80ms ease-in;
		}

		button:active {
			transform: scale(0.95);
		}

		button:focus {
			outline: none;
		}

		button.ghost {
			transition-duration: 0.4s;
			background-color: transparent;
			border-color: black;
			cursor:pointer;
		}

		button.ghost:hover {
			background-color:#EDE0D4;
			border-color: black;
			cursor:pointer;
			opacity:0.3s
		}

		button.btn {
			transition-duration: 0.4s;
			background-color:#DDB892;
			border-color: black;
			cursor:pointer;
		}

		button.btn:hover {
			background-color: #EDE0D4;
			border-color: black;
			cursor:pointer;
			opacity:0.3s
		}

		form {
			background-color: #FFFFFF;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 50px;
			height: 100%;
			text-align: center;
		}

		input {
			background-color: #eee;
			border: none;
			padding: 12px 15px;
			margin: 8px 0;
			width: 100%;
		}

		select
		{
			background-color: #eee;
			border: none;
			padding: 12px 15px;
			margin: 8px 0;
			width: 100%;
		}

		.container {
			background-color: #fff;
			border-radius: 10px;
			box-shadow: 0 14px 28px rgba(0,0,0,0.25), 
			0 10px 10px rgba(0,0,0,0.22);
			position: relative;
			overflow: hidden;
			width: 768px;
			max-width: 100%;
			min-height: 480px;
		}

		.form-container {
			position: absolute;
			top: 0;
			height: 100%;
			transition: all 0.6s ease-in-out;
		}

		.sign-in-container {
			left: 0;
			width: 50%;
			z-index: 2;
		}

		.container.right-panel-active .sign-in-container {
			transform: translateX(100%);
		}

		.sign-up-container {
			left: 0;
			width: 50%;
			opacity: 0;
			z-index: 1;
		}

		.container.right-panel-active .sign-up-container {
			transform: translateX(100%);
			opacity: 1;
			z-index: 5;
			animation: show 0.6s;
		}


		.overlay-container {
			position: absolute;
			top: 0;
			left: 50%;
			width: 50%;
			height: 100%;
			overflow: hidden;
			transition: transform 0.6s ease-in-out;
			z-index: 100;
		}

		.container.right-panel-active .overlay-container{
			transform: translateX(-100%);
		}

		.overlay {
			background: #FF416C;
			background: -webkit-linear-gradient(to right, #E6CCB2, #E6CCB2);
			background: linear-gradient(to right, #E6CCB2, #E6CCB2);
			background-repeat: no-repeat;
			background-size: cover;
			background-position: 0 0;
			color: black;
			position: relative;
			left: -100%;
			height: 100%;
			width: 200%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.container.right-panel-active .overlay {
			transform: translateX(50%);
		}

		.overlay-panel {
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 40px;
			text-align: center;
			top: 0;
			height: 100%;
			width: 50%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.overlay-left {
			transform: translateX(-20%);
		}

		.container.right-panel-active .overlay-left {
			transform: translateX(0);
		}

		.overlay-right {
			right: 0;
			transform: translateX(0);
		}

		.container.right-panel-active .overlay-right {
			transform: translateX(20%);
		}

		.head{
			font-size:4em;
			color: #B08968;; 
			text-shadow: -1px -1px 0 black,
						1px -1px 0 black,
						-1px 1px 0 black,
						1px 1px 0 black;
		}

		/* Modal for Loggin In */
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto;
			background-color: rgba(0, 0, 0, 0.4);
		}

		.modal-content {
			background-color: #fefefe;
			margin: 10% auto;
			margin-top:12%;
			padding: 30px;
			border: 1px solid #888;
			width: 25%;
			Height:45%;
			text-align: center;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		.close-btn {
			color: #aaa;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			margin-top: 10px;
		}

		.close-btn:hover,
		.close-btn:focus {
			color: #9C6644;
			text-decoration: none;
		}
		/* Modal for Loggin In */
	</style>


	<script>
		$(document).ready(function() {
			$('#signUp').click(() => $('#container').addClass('right-panel-active'));
			$('#signIn').click(() => $('#container').removeClass('right-panel-active'));

			$('#registerBtn').click(function (e) {
				e.preventDefault(); // Prevent form submission
				openRegistrationModal();
			});

			$('#loginBtn').click(function(e) {
				e.preventDefault(); // Prevent form submission
				var username = $('#lname').val();
				openModal();
				$('#welcomeMessage').text('Welcome, ' + username + '!');
			});
		});

		function openRegistrationModal() {
			$('#registrationModal').css('display', 'block');
		}

		function closeRegistrationModal() {
			$('#registrationModal').css('display', 'none');
		}

		function openModal() {
			$('#welcomeModal').css('display', 'block');
		}

		function closeModal() {
			$('#welcomeModal').css('display', 'none');
			window.location.href = 'index.html';
		}

		function resetForm() {
            // Reset the form by setting the value of each input field to an empty string
            document.getElementById('Name').value = '';
            document.getElementById('Email').value = '';
            document.getElementById('Password').value = '';
        }
	</script>
</head>

<body>

	<!-- Container for Log in and Register-->	
	<div class="container" id="container">
		<div class="form-container sign-up-container">
			<form method="POST">
				<h1>Register</h1>
				<span>Enter your details here</span>
				<input type="text" name="name" id="Name" placeholder="Enter name" required/>
				<input type="email" id="Email" placeholder="Enter email" required/>
				<input type="password" id="Password" name="password" placeholder="Enter password" required/>
				<button class="btn" id="registerBtn" type="submit" name="register" onclick="resetForm()">Register</button>
			</form>
		</div>
		
	<div class="form-container sign-in-container">
		<form method="POST">
			<h1 class="head">POTKIEES</h1>
			<h1>Log In</h1>
			<span>Enter your details here</span>
			<input type="text" name="lname" id="lname" placeholder="Username" required/>
			<input type="email" name="email" placeholder="Email" required />
			<input type="password" placeholder="Password" required />
			<button class="btn" id="loginBtn" type="submit" name="register">Log in</button>
		</form>
	</div>

	<div class="overlay-container">
		<div class="overlay">
			<div class="overlay-panel overlay-left">
				<h1>Welcome!</h1>
				<img src="HC1.png" style="Height:230px;">
				<p>Kindly register your personal information</p>
				<button class="ghost" id="signIn">Log In</button>
			</div>

			<div class="overlay-panel overlay-right">
				<h1>Good day!</h1>
				<img src="HC.png" style="height:250px;">
				<p>Enter your personal details to Log in</p>
				<button class="ghost" id="signUp">Register</button>
			</div>
		</div>
	</div>
	<!-- Container for Log in and Register-->	

    <!-- Modal for Loggin In -->
    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h1>Welcome!</h1>
            <p id="welcomeMessage">Thank you for logging in!</p>
			<button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>
	<!-- Modal for Loggin In -->

	<!-- Registration Success Modal -->
	<div id="registrationModal" class="modal">
		<div class="modal-content">
			<h1>Account Registered!</h1>
			<p>Your account has been successfully registered.</p>
			<button class="close-btn" onclick="closeRegistrationModal()">Close</button>
		</div>
	</div>
	<!-- Registration Success Modal -->

</body>
</html>
